<!DOCTYPE html>
<html>
<head>
    <title>To Do List</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Full viewport height */
            margin: 0; /* Remove default margins */
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Subtle shadow */
            width: 400px; /* Adjust width as needed */
        }

        h1 {
            text-align: center;
            color: #333; /* Darker heading color */
            margin-bottom: 20px;
        }

        #input-area {
            display: flex;
            margin-bottom: 15px;
        }

        #input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            background-color: #4CAF50; /* Green */
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049; /* Darker green on hover */
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee; /* Light gray separator */
        }

        li button {
            background-color: #f44336; /* Red delete button */
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: auto; /* Push to the right */
            font-size: 14px;
        }

        li button:hover {
            background-color: #da190b; /* Darker red on hover */
        }
    </style>
</head>
<body >
    <div class="container">  <h1>To Do List</h1>  <div id="input-area">  <input id="input" placeholder="Enter an item">
            <button onclick="add()">Add</button>
        </div>

        <ul id="list-container">
            <li>Hello <button onclick="deleteItem(event)">Delete</button></li>
        </ul>

        <script>
            // ... (Your JavaScript code remains the same)
            var ul = document.getElementById("list-container");
            var input = document.getElementById("input");

            function add() {
                var listitem = document.createElement("li");
                listitem.innerHTML = input.value + "<button onclick='deleteItem(event)'>Delete</button>";
                ul.append(listitem);
                input.value = ""; // Clear input after adding
            }

            function deleteItem(event) {
                event.target.parentElement.remove();
            }
        </script>
    </div> 
 </body>
</html>
